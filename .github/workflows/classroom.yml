name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: lab1
      id: lab1
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: lab1
        setup-command: ''
        command: make lab1
        timeout: 10
    - name: lab2_p2
      id: lab2_p2
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: lab2_p2
        setup-command: ''
        command: make lab2_p2
        timeout: 10
    - name: lab2_p3
      id: lab2_p3
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: lab2_p3
        setup-command: ''
        command: make lab2_p3
        timeout: 10
    - name: lab2_p4
      id: lab2_p4
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: lab2_p4
        setup-command: ''
        command: make lab2_p4
        timeout: 10
    - name: lab2_p5
      id: lab2_p5
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: lab2_p5
        setup-command: ''
        command: make lab2_p5
        timeout: 10
    - name: lab2_p8
      id: lab2_p8
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: lab2_p8
        setup-command: ''
        command: make lab2_p8
        timeout: 10
    - name: lab2_p9
      id: lab2_p9
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: lab2_p9
        setup-command: ''
        command: make lab2_p9
        timeout: 10
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        LAB1_RESULTS: "${{steps.lab1.outputs.result}}"
        LAB2_P2_RESULTS: "${{steps.lab2_p2.outputs.result}}"
        LAB2_P3_RESULTS: "${{steps.lab2_p3.outputs.result}}"
        LAB2_P4_RESULTS: "${{steps.lab2_p4.outputs.result}}"
        LAB2_P5_RESULTS: "${{steps.lab2_p5.outputs.result}}"
        LAB2_P8_RESULTS: "${{steps.lab2_p8.outputs.result}}"
        LAB2_P9_RESULTS: "${{steps.lab2_p9.outputs.result}}"
      with:
        runners: lab1,lab2_p2,lab2_p3,lab2_p4,lab2_p5,lab2_p8,lab2_p9
